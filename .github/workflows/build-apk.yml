name: UltraIsland Native APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          mkdir -p extracted
          unzip -q UltraIsland-Android-fixed.zip -d extracted

      - name: Locate Android Project
        run: |
          ANDROID_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")

          if [ -z "$ANDROID_DIR" ] || [ ! -f "$ANDROID_DIR/app/build.gradle.kts" ]; then
            echo "Android project not found!"
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        run: |
          gradle --no-daemon \
            -p "$ANDROID_DIR" \
            :app:assembleDebug

      - name: Verify APK
        run: |
          APK=$(find "$ANDROID_DIR/app/build/outputs/apk/debug" -name "*.apk" -print -quit)

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "APK not found or empty!"
            exit 1
          fi

          echo "APK successfully generated: $APK"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraIsland-debug-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14
